[package]
name = "antikythera-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "CLI interface for Antikythera MCP client"

[features]
default = ["multi-agent", "native-transport"]
multi-agent = ["antikythera-core/multi-agent"]
native-transport = ["antikythera-core/native-transport", "dep:sysinfo"]
wizard = ["antikythera-core/wizard"]

[[bin]]
name = "antikythera"
path = "src/bin/menu.rs"

[[bin]]
name = "antikythera-config"
path = "src/bin/config.rs"

[dependencies]
antikythera-core = { path = "../antikythera-core", version = "1.0.0", features = ["full"] }
antikythera-sdk = { path = "../antikythera-sdk", version = "1.0.0", features = ["component"] }
antikythera-log = { path = "../antikythera-log", version = "1.0.0" }
antikythera-session = { path = "../antikythera-session", version = "1.0.0" }
antikythera-storage = { path = "../antikythera-storage", version = "1.1.0", features = ["filesystem"] }

# Core async runtime
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

# HTTP client (for LLM API calls and transport)
reqwest = { workspace = true, features = ["json", "stream"] }
reqwest-eventsource.workspace = true
tokio-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
postcard = { workspace = true }

# CLI and TUI
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true

# Error handling and logging
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
sysinfo = { workspace = true, optional = true }
dotenvy.workspace = true
shellexpand.workspace = true
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.39", features = ["test-util"] }
serial_test = "3.0"
antikythera-sdk = { path = "../antikythera-sdk", version = "1.0.0", features = ["component"] }
