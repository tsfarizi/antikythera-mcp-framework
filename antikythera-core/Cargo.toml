[package]
name = "antikythera-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core MCP protocol, transport layers, and agent runtime"

[dependencies]
# Core async runtime (non-wasm: all features; wasm: limited features)
tokio = { workspace = true }
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true

# Logging
antikythera-log = { path = "../antikythera-log", version = "1.0.0", features = ["subscriber"] }

# Extracted crates
antikythera-domain = { path = "../antikythera-domain" }
antikythera-config = { path = "../antikythera-config" }
antikythera-ports = { path = "../antikythera-ports" }
antikythera-resilience = { path = "../antikythera-resilience" }
antikythera-tooling = { path = "../antikythera-tooling" }
antikythera-observability = { path = "../antikythera-observability" }

# HTTP and networking
reqwest.workspace = true
reqwest-eventsource.workspace = true



# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
postcard.workspace = true

# Error handling and logging
thiserror.workspace = true
once_cell = "1.19"

# Utilities
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
sysinfo.workspace = true
dotenvy.workspace = true
shellexpand.workspace = true
regex = "1.10"
# TUI and wizard
crossterm.workspace = true
ratatui.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# Additional tokio features for native targets only
tokio = { workspace = true, features = ["process", "io-std"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.39", features = ["test-util"] }
