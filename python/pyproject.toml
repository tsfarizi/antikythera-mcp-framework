[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antikythera-agent"
version = "1.7.1"
description = "Antikythera Agent Runtime - Multi-agent orchestration with MCP tool integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "tsfarizi"}
]
keywords = ["agent", "runtime", "mcp", "llm", "wasm", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tsfarizi/antikythera-agent-sdk"
Repository = "https://github.com/tsfarizi/antikythera-agent-sdk"
Issues = "https://github.com/tsfarizi/antikythera-agent-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
antikythera_agent = ["*.pyi", "py.typed", "*.wasm"]
