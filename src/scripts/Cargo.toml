[package]
name = "build-scripts"
version.workspace = true
edition.workspace = true
publish = false
# CI invokes `cargo run -p build-scripts -- release -- validate` without `--bin`;
# `wit-validator` is the only binary that understands the `validate` argument.
# `sync-release-version` is always selected explicitly via `--bin` in CI.
default-run = "wit-validator"

[[bin]]
name = "wit-validator"
path = "build-component.rs"

[[bin]]
name = "sync-release-version"
path = "sync-release-version.rs"

[dependencies]
# No external dependencies needed - use stdlib only
