[package]
name = "logic-hooks-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deterministic host-authored logic-hooks probe: decide-action always forces a final action (proof of dual-host override)"

[lib]
# rlib:   native Rust builds (lets the host author unit-test custom_* logic).
# cdylib: required by cargo-component to emit the wasm32-wasip2 component
#         artifact (same dual crate-type as plugin/antikythera-default-hooks).
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# World exported by this component; `path` is resolved relative to this
# crate's manifest directory. The crate lives at examples/logic-hooks-example,
# two levels below the repo root, so the canonical root `wit/` is `../../wit`
# (same relative path as plugin/antikythera-default-hooks).
[package.metadata.component.target]
path = "../../../wit"
world = "logic-hooks-component"

[features]
default = []
# Server-side WASM Component Model support (wasm32-wasip2 WASI).
component = ["dep:wit-bindgen"]

[dependencies]
# WIT bindings generator for the component world (component feature only).
# Pin matches plugin/antikythera-default-hooks and the locked 0.40.0 so the
# emitted `component-type` sections decode cleanly with wasm-tools 1.256.
wit-bindgen = { version = "0.40.0", optional = true }
