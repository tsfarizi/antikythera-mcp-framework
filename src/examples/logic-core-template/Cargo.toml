[package]
name = "logic-core-template"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-authored drop-in logic core component template: exports the runner interface (16 functions, JSON-string semantics identical to the composite SDK), in-memory session store for init/get-state/reset-session, structured not-implemented errors elsewhere"

[lib]
# rlib:   native Rust builds (lets the host author unit-test custom_* logic).
# cdylib: required by cargo-component to emit the wasm32-wasip2 component
#         artifact (same dual crate-type as examples/logic-hooks-template).
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# World exported by this component; `path` is resolved relative to this
# crate's manifest directory. The crate lives at examples/logic-core-template,
# two levels below the repo root, so the canonical root `wit/` is `../../wit`
# (same relative path as examples/logic-hooks-template).
[package.metadata.component.target]
path = "../../../wit"
world = "logic-core-component"

[features]
default = []
# Server-side WASM Component Model support (wasm32-wasip2 WASI).
component = ["dep:wit-bindgen", "dep:serde_json"]

[dependencies]
# WIT bindings generator for the component world (component feature only).
# Pin matches examples/logic-hooks-template and the locked 0.40.0 so the
# emitted `component-type` sections decode cleanly with wasm-tools 1.256.
wit-bindgen = { version = "0.40.0", optional = true }
# JSON handling for the in-memory session store and structured errors
# (component feature only: the lib.rs custom_* surface is JSON-free by design).
serde_json = { workspace = true, optional = true }
