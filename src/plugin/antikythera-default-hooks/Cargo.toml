[package]
name = "antikythera-default-hooks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Default no-op passthrough implementation of the logic-hooks interface for the Antikythera SDK"

[lib]
# rlib:   native Rust builds.
# cdylib: required by cargo-component to emit the wasm32-wasip2 component
#         artifact (same dual crate-type as antikythera-toolrunner).
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# World exported by this component; `path` is resolved relative to this
# crate's manifest directory. The crate lives at plugin/antikythera-default-hooks,
# two levels below the repo root, so the canonical root `wit/` is `../../wit`
# (same relative path as the sibling antikythera-toolrunner crate).
[package.metadata.component.target]
path = "../../../wit"
world = "logic-hooks-component"

[features]
default = []
# Server-side WASM Component Model support (wasm32-wasip2 WASI).
# No `wasm` bridge feature: this crate has no in-process WASM logic, the
# component is a pure passthrough export layer.
component = ["dep:wit-bindgen"]

[dependencies]
# WIT bindings generator for the component world (component feature only).
# The pinned wit-bindgen version matches the toolchain's wit-parser so the
# emitted `component-type` sections decode cleanly (same pin as toolrunner).
wit-bindgen = { version = "0.40.0", optional = true }
