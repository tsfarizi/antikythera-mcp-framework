name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  checks: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --lib --bins -- -D warnings -D deprecated

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo check --workspace

  wasm-check:
    strategy:
      matrix:
        include:
          # legacy (wasm-bindgen path, retained for compatibility)
          - target: wasm32-unknown-unknown
            check_cmd: |
              cargo check -p antikythera-sdk --target wasm32-unknown-unknown --no-default-features --features wasm
              cargo check -p antikythera-wasm-bindgen --target wasm32-unknown-unknown
          - target: wasm32-wasip1
            check_cmd: |
              cargo check -p antikythera-sdk --target wasm32-wasip1 --no-default-features --features component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.check_cmd }}

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate WIT conformance
        run: cargo run -p build-scripts --release -- validate

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook
      - run: mdbook build

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/antikythera-web/package-lock.json
      - name: Install dependencies
        working-directory: examples/antikythera-web
        run: npm ci
      - name: Build web example
        working-directory: examples/antikythera-web
        run: npm run build

  wasm-component-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Build SDK component
        run: cargo component build -p antikythera-sdk --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo component build -p antikythera-toolrunner --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo component build -p antikythera-default-hooks --release --target wasm32-wasip1 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip1/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip1/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip1/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip1/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip1/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip1/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip1/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

      - name: Transpile composite WASM component to JS with jco
        run: |
          npx jco transpile dist/antikythera-sdk.wasm \
            --out-dir npm/antikythera-sdk/component \
            -M "wasi:cli/environment@0.2.3=./wasi-stubs/environment.js" \
            -M "wasi:cli/exit@0.2.3=./wasi-stubs/exit.js" \
            -M "wasi:cli/stderr@0.2.3=./wasi-stubs/stderr.js" \
            -M "wasi:cli/stdin@0.2.3=./wasi-stubs/stdin.js" \
            -M "wasi:cli/stdout@0.2.3=./wasi-stubs/stdout.js" \
            -M "wasi:clocks/monotonic-clock@0.2.3=./wasi-stubs/monotonic-clock.js" \
            -M "wasi:clocks/wall-clock@0.2.3=./wasi-stubs/wall-clock.js" \
            -M "wasi:filesystem/preopens@0.2.3=./wasi-stubs/preopens.js" \
            -M "wasi:filesystem/types@0.2.3=./wasi-stubs/types.js" \
            -M "wasi:io/error@0.2.3=./wasi-stubs/error.js" \
            -M "wasi:io/streams@0.2.3=./wasi-stubs/streams.js" \
            -M "wasi:random/random@0.2.3=./wasi-stubs/random.js"

      - name: Run composite compatibility tests
        run: cargo test -p antikythera-tests --test compatibility_tests

      - name: Smoke test transpiled WASM component
        run: |
          node --input-type=module - <<'EOF'
          import { runner } from './npm/antikythera-sdk/component/antikythera-sdk.js';
          const initResult = runner.init('{"session_id":"smoke-1"}');
          if (initResult !== 'smoke-1') {
            throw new Error('init did not return session_id "smoke-1", got: ' + JSON.stringify(initResult));
          }
          const state = JSON.parse(runner.getState('smoke-1'));
          if (typeof state !== 'object' || state === null) {
            throw new Error('getState did not return a JSON object');
          }
          console.log('NODE_COMPONENT_SMOKE_OK session=' + initResult + ' state_keys=' + Object.keys(state).join(','));
          EOF
