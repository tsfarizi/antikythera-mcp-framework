name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.0). Required for manual dispatch; ignored on tag push.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-wasm-browser:
    name: Build Browser WASM
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build browser WASM
        working-directory: plugin/antikythera-wasm-bindgen
        run: wasm-pack build --target web --release --out-dir pkg-web

      - name: Upload browser WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-browser
          path: |
            plugin/antikythera-wasm-bindgen/pkg-web/antikythera_wasm_bindgen_bg.wasm
            plugin/antikythera-wasm-bindgen/pkg-web/antikythera_wasm_bindgen.js
            plugin/antikythera-wasm-bindgen/pkg-web/antikythera_wasm_bindgen.d.ts

  build-wasm-nodejs:
    name: Build Node.js WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Node.js WASM
        working-directory: plugin/antikythera-wasm-bindgen
        run: wasm-pack build --target nodejs --release --out-dir pkg-nodejs

      - name: Upload Node.js WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-nodejs
          path: |
            plugin/antikythera-wasm-bindgen/pkg-nodejs/antikythera_wasm_bindgen_bg.wasm
            plugin/antikythera-wasm-bindgen/pkg-nodejs/antikythera_wasm_bindgen.js
            plugin/antikythera-wasm-bindgen/pkg-nodejs/antikythera_wasm_bindgen.d.ts

  build-wasm-server:
    name: Build Server WASM (WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install WASI SDK
        run: |
          set -e
          curl -sL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -C /opt -xzf wasi-sdk.tar.gz --strip-components=1
          echo "/opt/bin" >> $GITHUB_PATH

      - name: Configure cross-compilation environment
        run: |
          echo "CC_wasm32_wasip1=/opt/bin/clang" >> $GITHUB_ENV
          echo "AR_wasm32_wasip1=/opt/bin/llvm-ar" >> $GITHUB_ENV
          echo "CFLAGS_wasm32_wasip1=--sysroot=/opt/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Install cargo-component
        run: cargo install cargo-component

      - name: Build WASM component
        run: cargo component build --release --target wasm32-wasip1 -p antikythera-sdk

      - name: Upload server WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-server
          path: target/wasm32-wasip1/release/antikythera_sdk.wasm

  publish-npm:
    name: Publish npm Package
    needs: [build-wasm-browser, build-wasm-nodejs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download browser WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-browser
          path: npm/antikythera-sdk/

      - name: Download Node.js WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-nodejs
          path: npm/antikythera-sdk/pkg-nodejs/

      - name: Set version from tag
        run: |
          VERSION="${{ needs.build-wasm-browser.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" npm/antikythera-sdk/package.json
          echo "npm version set to $VERSION"

      - name: Publish to npm
        working-directory: npm/antikythera-sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python Package
    needs: [build-wasm-browser, build-wasm-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download server WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-server
          path: python/antikythera_agent/

      - name: Rename WASM binary
        run: mv python/antikythera_agent/antikythera_sdk.wasm python/antikythera_agent/antikythera.wasm

      - name: Set version from tag
        run: |
          VERSION="${{ needs.build-wasm-browser.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" python/antikythera_agent/__init__.py
          echo "Python version set to $VERSION"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        working-directory: python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-wasm-browser, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download server WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-wasm-browser.outputs.version }}
          name: v${{ needs.build-wasm-browser.outputs.version }}
          generate_release_notes: true
          files: wasm-server/antikythera_sdk.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
