name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-wasm:
    name: Build WASM Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install WASI SDK
        run: |
          set -e
          WASI_SDK_VERSION=24
          curl -sL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -C /opt -xzf wasi-sdk.tar.gz --strip-components=1
          echo "/opt/bin" >> $GITHUB_PATH

      - name: Configure cross-compilation environment
        run: |
          echo "CC_wasm32_wasip1=/opt/bin/clang" >> $GITHUB_ENV
          echo "AR_wasm32_wasip1=/opt/bin/llvm-ar" >> $GITHUB_ENV
          echo "CFLAGS_wasm32_wasip1=--sysroot=/opt/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Install cargo-component
        run: cargo install cargo-component

      - name: Build WASM component
        run: cargo component build --release --target wasm32-wasip1 -p antikythera-sdk

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-component
          path: target/wasm32-wasip1/release/antikythera_sdk.wasm

  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: antikythera-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: antikythera-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: antikythera-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        working-directory: example/antikythera-cli
        run: cargo build --release --bin antikythera --target ${{ matrix.target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: example/antikythera-cli/target/${{ matrix.target }}/release/antikythera*

  publish-npm:
    name: Publish npm Package
    needs: [build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-component
          path: npm/antikythera-sdk/

      - name: Rename WASM binary
        run: mv npm/antikythera-sdk/antikythera_sdk.wasm npm/antikythera-sdk/antikythera.wasm

      - name: Publish to npm
        working-directory: npm/antikythera-sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python Package
    needs: [build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-component
          path: python/antikythera/

      - name: Rename WASM binary
        run: mv python/antikythera/antikythera_sdk.wasm python/antikythera/antikythera.wasm

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        working-directory: python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-cli, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archive (Linux)
        run: tar -czf antikythera-linux-amd64.tar.gz antikythera-linux-amd64/

      - name: Create release archive (macOS)
        run: tar -czf antikythera-macos-arm64.tar.gz antikythera-macos-arm64/

      - name: Create release archive (Windows)
        run: 7z a antikythera-windows-amd64.zip antikythera-windows-amd64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            antikythera-linux-amd64.tar.gz
            antikythera-macos-arm64.tar.gz
            antikythera-windows-amd64.zip
            wasm-component/antikythera_sdk.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
