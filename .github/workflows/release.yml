name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.0). Required for manual dispatch; ignored on tag push.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-wasm-component:
    name: Build WASM Component + jco Transpile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Build SDK component
        run: cargo component build -p antikythera-sdk --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo component build -p antikythera-toolrunner --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo component build -p antikythera-default-hooks --release --target wasm32-wasip1 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip1/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip1/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip1/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip1/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip1/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip1/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip1/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

      - name: Transpile composite WASM component to JS with jco
        run: |
          npx jco transpile dist/antikythera-sdk.wasm \
            --out-dir npm/antikythera-sdk/component \
            -M "wasi:cli/environment@0.2.3=./wasi-stubs/environment.js" \
            -M "wasi:cli/exit@0.2.3=./wasi-stubs/exit.js" \
            -M "wasi:cli/stderr@0.2.3=./wasi-stubs/stderr.js" \
            -M "wasi:cli/stdin@0.2.3=./wasi-stubs/stdin.js" \
            -M "wasi:cli/stdout@0.2.3=./wasi-stubs/stdout.js" \
            -M "wasi:clocks/monotonic-clock@0.2.3=./wasi-stubs/monotonic-clock.js" \
            -M "wasi:clocks/wall-clock@0.2.3=./wasi-stubs/wall-clock.js" \
            -M "wasi:filesystem/preopens@0.2.3=./wasi-stubs/preopens.js" \
            -M "wasi:filesystem/types@0.2.3=./wasi-stubs/types.js" \
            -M "wasi:io/error@0.2.3=./wasi-stubs/error.js" \
            -M "wasi:io/streams@0.2.3=./wasi-stubs/streams.js" \
            -M "wasi:random/random@0.2.3=./wasi-stubs/random.js"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging/component
          cp -r npm/antikythera-sdk/component/. staging/component/
          cp dist/antikythera-sdk.wasm staging/antikythera-sdk.wasm
          cp wit/antikythera.wit staging/antikythera.wit

      - name: Upload WASM component artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-component
          path: staging/
          if-no-files-found: error

  build-wasm-server:
    name: Build Server WASM (WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install WASI SDK
        run: |
          set -e
          curl -sL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -C /opt -xzf wasi-sdk.tar.gz --strip-components=1
          echo "/opt/bin" >> $GITHUB_PATH

      - name: Configure cross-compilation environment
        run: |
          echo "CC_wasm32_wasip1=/opt/bin/clang" >> $GITHUB_ENV
          echo "AR_wasm32_wasip1=/opt/bin/llvm-ar" >> $GITHUB_ENV
          echo "CFLAGS_wasm32_wasip1=--sysroot=/opt/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Install cargo-component
        run: cargo install cargo-component

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Build SDK component
        run: cargo component build -p antikythera-sdk --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo component build -p antikythera-toolrunner --release --target wasm32-wasip1 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo component build -p antikythera-default-hooks --release --target wasm32-wasip1 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip1/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip1/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip1/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip1/release/antikythera-default-hooks.wasm
          wasm-tools compose target/wasm32-wasip1/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip1/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip1/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm
          # wasm-server consumers (publish-pypi rename, create-release attach)
          # expect the underscore-crate filename; stage a copy for the artifact.
          cp dist/antikythera-sdk.wasm staging/antikythera_sdk.wasm

      - name: Upload server WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-server
          path: staging/antikythera_sdk.wasm

  publish-npm:
    name: Publish npm Package
    needs: [build-wasm-component]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM component artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-component
          path: npm/antikythera-sdk/

      - name: Set version from tag
        run: |
          VERSION="${{ needs.build-wasm-component.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" npm/antikythera-sdk/package.json
          echo "npm version set to $VERSION"

      - name: Publish to npm
        working-directory: npm/antikythera-sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python Package
    needs: [build-wasm-component, build-wasm-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download server WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-server
          path: python/antikythera_agent/

      - name: Rename WASM binary
        run: mv python/antikythera_agent/antikythera_sdk.wasm python/antikythera_agent/antikythera.wasm

      - name: Set version from tag
        run: |
          VERSION="${{ needs.build-wasm-component.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" python/antikythera_agent/__init__.py
          echo "Python version set to $VERSION"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        working-directory: python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-wasm-component, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download server WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-wasm-component.outputs.version }}
          name: v${{ needs.build-wasm-component.outputs.version }}
          generate_release_notes: true
          files: wasm-server/antikythera_sdk.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
