name: WASM Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Validate WIT conformance
        run: cargo run -p build-scripts --release -- validate

      - name: Build SDK component
        run: cargo component build -p antikythera-sdk --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build toolrunner component
        run: cargo component build -p antikythera-toolrunner --release --target wasm32-wasip2 --no-default-features --features component

      - name: Build default-hooks component
        run: cargo component build -p antikythera-default-hooks --release --target wasm32-wasip2 --no-default-features --features component

      - name: Compose SDK + toolrunner + default-hooks into dist composite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # wasm-tools compose rejects underscore crate names; use kebab-case copies.
          cp target/wasm32-wasip2/release/antikythera_toolrunner.wasm \
            target/wasm32-wasip2/release/antikythera-toolrunner.wasm
          cp target/wasm32-wasip2/release/antikythera_default_hooks.wasm \
            target/wasm32-wasip2/release/antikythera-default-hooks.wasm

          wasm-tools compose target/wasm32-wasip2/release/antikythera_sdk.wasm \
            -d target/wasm32-wasip2/release/antikythera-toolrunner.wasm \
            -d target/wasm32-wasip2/release/antikythera-default-hooks.wasm \
            -o dist/antikythera-sdk.wasm

          cp wit/antikythera.wit dist/antikythera.wit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Transpile composite WASM component to JS with jco
        run: |
          npx jco transpile dist/antikythera-sdk.wasm \
            --out-dir npm/antikythera-sdk/component \
            -M "wasi:cli/environment@0.2.3=./wasi-stubs/environment.js" \
            -M "wasi:cli/exit@0.2.3=./wasi-stubs/exit.js" \
            -M "wasi:cli/stderr@0.2.3=./wasi-stubs/stderr.js" \
            -M "wasi:cli/stdin@0.2.3=./wasi-stubs/stdin.js" \
            -M "wasi:cli/stdout@0.2.3=./wasi-stubs/stdout.js" \
            -M "wasi:clocks/monotonic-clock@0.2.3=./wasi-stubs/monotonic-clock.js" \
            -M "wasi:clocks/wall-clock@0.2.3=./wasi-stubs/wall-clock.js" \
            -M "wasi:filesystem/preopens@0.2.3=./wasi-stubs/preopens.js" \
            -M "wasi:filesystem/types@0.2.3=./wasi-stubs/types.js" \
            -M "wasi:io/error@0.2.3=./wasi-stubs/error.js" \
            -M "wasi:io/streams@0.2.3=./wasi-stubs/streams.js" \
            -M "wasi:random/random@0.2.3=./wasi-stubs/random.js"

      - name: Rename transpiled core modules to semantic names
        run: node scripts/post-transpile-rename.mjs

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antikythera-wasm
          path: dist/

      - name: Upload component transpile artifact
        uses: actions/upload-artifact@v4
        with:
          name: antikythera-wasm-component
          path: npm/antikythera-sdk/component/
          if-no-files-found: error
