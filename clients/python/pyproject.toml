[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antikythera-agent"
version = "1.8.5"
description = "General-purpose agent runtime with multi-agent orchestration, MCP tool integration, and WebAssembly support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "tsfarizi"}
]
keywords = ["agent", "runtime", "mcp", "llm", "wasm", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
wasm = ["wasmtime>=42.0"]
dev = ["pytest>=7.0", "wasmtime>=42.0"]

[project.urls]
Homepage = "https://github.com/tsfarizi/antikythera-agent-sdk"
Repository = "https://github.com/tsfarizi/antikythera-agent-sdk"
Issues = "https://github.com/tsfarizi/antikythera-agent-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
# Positive include pins discovery to the actual distribution root. Without it,
# auto-discovery sweeps build/lib and tests/, so a second in-tree build nests
# build/lib/build/lib and blows past MAX_PATH on Windows.
include = ["antikythera_agent*"]

[tool.setuptools.package-data]
antikythera_agent = ["*.pyi", "py.typed", "*.wasm", "component/**"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Production code is frozen for packaging work; every entry below lists exactly
# the rule classes observed at gate-introduction time (no blanket disables).
# `uph-unit` marks debt owned by another unit (do not fix here).
"antikythera_agent/__init__.py" = ["E501", "I001"] # docstring example line + legacy import order
"antikythera_agent/__init__.pyi" = ["I001"] # stub re-export order mirrors __init__.py
"antikythera_agent/agent.py" = ["F401", "I001"] # unused Path/Any kept by owner unit
"antikythera_agent/orchestrator.py" = ["F401", "I001"] # unused Path kept by owner unit
"antikythera_agent/types.py" = ["F401"] # unused dataclasses.field kept by owner unit
"antikythera_agent/server/bridge.py" = ["F401"] # unused threading/Tuple kept by owner unit
"antikythera_agent/server/transport.py" = ["I001"] # wire-module import order pinned by owner unit
# Test suite mirrors byte-exact golden wire fixtures; long literal lines and
# import blocks shaped like the mirrored Rust lane are intentional.
"tests/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
allow_redefinition = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# uph-unit: frozen production modules owned by other units. Each disabled code
# below matches concrete findings at gate-introduction time (no blanket skips):
# control.py   -> two `dict | None` returns on miss paths
# transport.py -> optional-transport dispatch table + handler return unions
# __main__.py  -> StubProvider dict fed into the provider option union
# orchestrator.py -> _classify_loop_error Optional[str] fed into TaskResult.error_kind Literal union
module = ["antikythera_agent.server.control", "antikythera_agent.server.transport", "antikythera_agent.server.__main__", "antikythera_agent.orchestrator"]
disable_error_code = ["return-value", "union-attr", "list-item", "arg-type"]
