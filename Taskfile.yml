# Taskfile for Antikythera Agent SDK
# Usage: task <task-name>
# Docs: https://taskfile.dev

version: '3'

silent: true

dotenv:
  - config/.env

vars:
  WASM_TARGET: wasm32-wasip1
  WASM_BINARY: target/{{.WASM_TARGET}}/release/antikythera_sdk.wasm
  TOOLRUNNER_BINARY: target/{{.WASM_TARGET}}/release/antikythera_toolrunner.wasm
  # wasm-tools compose rejects crate names with underscores; the toolrunner
  # component must be copied to a kebab-case name before composing.
  TOOLRUNNER_KEBAB: target/{{.WASM_TARGET}}/release/antikythera-toolrunner.wasm
  DIST_SDK: dist/antikythera-sdk.wasm
  APP_CONFIG: app.toml
  PROVIDER_ID: '{{default "local-ollama" .PROVIDER_ID}}'
  PROVIDER_TYPE: '{{default "ollama" .PROVIDER_TYPE}}'
  PROVIDER_ENDPOINT: '{{default "http://127.0.0.1:11434" .PROVIDER_ENDPOINT}}'
  PROVIDER_API_KEY: '{{default "" .PROVIDER_API_KEY}}'
  MODEL_NAME: '{{default "gpt-oss:120b-cloud" .MODEL_NAME}}'

tasks:

  # ===========================================================================
  # Default Task - Show Help
  # ===========================================================================
  default:
    desc: Show available tasks
    cmds:
      - |
        echo "Antikythera Agent SDK - Available Tasks"
        echo ""
        echo "  === Native Development (No WASM Required) ==="
        echo "  task run             - Run chat agent (Ollama, default model)"
        echo "  task run-model       - Run chat agent with custom model (MODEL_NAME=xxx)"
        echo "  task run-chat        - Run chat example from examples/chat"
        echo "  task check-native    - Check code (native target only)"
        echo "  task test-native     - Run tests (native target only)"
        echo ""
        echo "  === WASM Development (Optional) ==="
        echo "  task build           - Build composite WASM component (SDK + toolrunner -> dist/antikythera-sdk.wasm)"
        echo "  task build-wasm-harness - Build standalone SDK WASM artifact (for FFI host harness)"
        echo "  task build-toolrunner - Build standalone toolrunner WASM artifact"
        echo "  task compose         - Compose SDK + toolrunner into dist/antikythera-sdk.wasm"
        echo "  task build-all       - Build all WASM artifacts (standalone SDK + toolrunner + composite)"
        echo "  task check-wasm      - Check WASM compilation"
        echo "  task transpile       - Transpile composite (dist) to JS bindings with jco"
        echo "  task inspect         - Inspect composite component with wasm-tools"
        echo ""
        echo "  === Examples ==="
        echo "  task run-web         - Run web frontend dev server"
        echo "  task build-web       - Build web frontend for production"
        echo ""
        echo "  === Quality ==="
        echo "  task check           - Check all code"
        echo "  task test            - Run all tests"
        echo "  task lint            - Run clippy linter"
        echo "  task format          - Format code with rustfmt"
        echo ""

  # ===========================================================================
  # Build Tasks
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # WASM deliverables are COMPOSITE: the runner component
  # (antikythera-sdk) imports tool-registry; the toolrunner component exports
  # it. `wasm-tools compose` wires the two into dist/antikythera-sdk.wasm.
  # Anything consuming dist (jco transpile, wasmtime harness) MUST see the
  # composite, never the standalone SDK (it carries an unmet tool-registry
  # import and fails runtime smoke).
  # ---------------------------------------------------------------------------

  build:
    desc: Build composite WASM component (SDK + toolrunner -> dist/antikythera-sdk.wasm)
    deps:
      - wit
    cmds:
      - echo "Building composite WASM component..."
      - task: compose

  build-wasm-harness:
    desc: Build standalone SDK WASM component (wasm32-wasip1, feature component)
    deps:
      - wit
    cmds:
      - echo "Building standalone SDK WASM component..."
      - cargo component build -p antikythera-sdk --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK standalone SDK component built: {{.WASM_BINARY}}"'
      - task: size

  build-toolrunner:
    desc: Build standalone toolrunner WASM component (wasm32-wasip1, feature component)
    cmds:
      - echo "Building standalone toolrunner WASM component..."
      - cargo component build -p antikythera-toolrunner --target {{.WASM_TARGET}} --release --no-default-features --features component
      - echo ""
      - 'echo "OK standalone toolrunner component built: {{.TOOLRUNNER_BINARY}}"'
      - task: size

  compose:
    desc: Compose SDK + toolrunner into composite dist/antikythera-sdk.wasm
    deps:
      - build-wasm-harness
      - build-toolrunner
    cmds:
      - echo "Composing SDK + toolrunner into composite..."
      - mkdir -p dist
      # wasm-tools compose rejects the underscore crate name; use kebab-case copy.
      - cp {{.TOOLRUNNER_BINARY}} {{.TOOLRUNNER_KEBAB}}
      - wasm-tools compose {{.WASM_BINARY}} -d {{.TOOLRUNNER_KEBAB}} -o {{.DIST_SDK}}
      - echo ""
      - 'echo "OK composite built: {{.DIST_SDK}}"'
      - task: size

  build-all:
    desc: Build all WASM artifacts (standalone SDK + toolrunner + composite)
    cmds:
      - task: build-wasm-harness
      - task: build-toolrunner
      - task: compose

  wit:
    desc: Validate WIT file conformance against Rust source types
    cmds:
      - echo "Validating WIT conformance..."
      - cargo run -p build-scripts --release -- validate

  transpile:
    desc: Transpile composite WASM component to JS bindings with jco
    deps:
      - compose
    cmds:
      - echo "Transpiling composite WASM component with jco..."
      # jco has no --dts flag (typescript output is default); the 12 -M flags
      # map every WASI interface the component imports to local stubs under the
      # output directory (npm/antikythera-sdk/component/wasi-stubs).
      - |
        npx jco transpile dist/antikythera-sdk.wasm --out-dir npm/antikythera-sdk/component \
          -M "wasi:cli/environment@0.2.3=./wasi-stubs/environment.js" \
          -M "wasi:cli/exit@0.2.3=./wasi-stubs/exit.js" \
          -M "wasi:cli/stderr@0.2.3=./wasi-stubs/stderr.js" \
          -M "wasi:cli/stdin@0.2.3=./wasi-stubs/stdin.js" \
          -M "wasi:cli/stdout@0.2.3=./wasi-stubs/stdout.js" \
          -M "wasi:clocks/monotonic-clock@0.2.3=./wasi-stubs/monotonic-clock.js" \
          -M "wasi:clocks/wall-clock@0.2.3=./wasi-stubs/wall-clock.js" \
          -M "wasi:filesystem/preopens@0.2.3=./wasi-stubs/preopens.js" \
          -M "wasi:filesystem/types@0.2.3=./wasi-stubs/types.js" \
          -M "wasi:io/error@0.2.3=./wasi-stubs/error.js" \
          -M "wasi:io/streams@0.2.3=./wasi-stubs/streams.js" \
          -M "wasi:random/random@0.2.3=./wasi-stubs/random.js"
      - echo ""
      - echo "✓ Transpiled to npm/antikythera-sdk/component"

  transpile-clean:
    desc: Remove transpiled JS output directory
    cmds:
      - echo "Cleaning transpiled output..."
      - |
        if [ -d "npm/antikythera-sdk/component" ]; then
          rm -rf "npm/antikythera-sdk/component"
        fi
      - echo "✓ Transpile output clean complete"

  # ===========================================================================
  # Run Tasks
  # ===========================================================================

  run:
    desc: Run chat agent (Ollama, default model)
    cmds:
      - echo "Starting chat agent..."
      - cargo run -p chat-example --release

  run-model:
    desc: Run chat agent with custom model
    cmds:
      - 'echo "Starting chat agent with model: {{.MODEL_NAME}}"'
      - cargo run -p chat-example --release -- {{.MODEL_NAME}}

  run-chat:
    desc: Run chat example from examples/chat
    dir: examples/chat
    cmds:
      - echo "Starting chat example..."
      - cargo run --release

  run-web:
    desc: Run web frontend dev server (Vite)
    dir: examples/antikythera-web
    cmds:
      - echo "Starting web frontend dev server..."
      - npm run dev

  build-web:
    desc: Build web frontend for production
    dir: examples/antikythera-web
    cmds:
      - echo "Building web frontend..."
      - npm run build
      - echo "✓ Web frontend built to examples/antikythera-web/dist/"

  # ===========================================================================
  # Test Tasks
  # ===========================================================================

  test:
    desc: Run all tests
    cmds:
      - echo "Running all tests..."
      - cargo test --workspace
      - echo ""
      - echo "✓ All tests passed"

  test-native:
    desc: Run tests (native target only)
    cmds:
      - echo "Running native tests..."
      - cargo test --workspace
      - echo ""
      - echo "✓ Native tests passed"

  test-sdk:
    desc: Run SDK tests
    cmds:
      - echo "Running SDK tests..."
      - cargo test -p antikythera-sdk --lib
      - echo ""
      - echo "✓ SDK tests passed"

  test-ffi:
    desc: Run FFI tests
    cmds:
      - echo "Running FFI tests..."
      - cargo test -p antikythera-sdk --lib ffi
      - echo ""
      - echo "✓ FFI tests passed"

  test-component:
    desc: Run component tests
    cmds:
      - echo "Running component tests..."
      - cargo test -p antikythera-sdk --lib component
      - echo ""
      - echo "✓ Component tests passed"

  # ===========================================================================
  # Check Tasks
  # ===========================================================================

  check:
    desc: Check all code
    cmds:
      - echo "Checking all code..."
      - cargo check --workspace
      - echo ""
      - echo "✓ Code check passed"

  check-native:
    desc: Check code (native target only)
    cmds:
      - echo "Checking native code..."
      - cargo check --workspace
      - echo ""
      - echo "✓ Native code check passed"

  check-wasm:
    desc: Check WASM compilation
    cmds:
      - echo "Checking WASM compilation..."
      - cargo check -p antikythera-sdk --target {{.WASM_TARGET}}
      - echo ""
      - echo "✓ WASM check passed"

  # ===========================================================================
  # Clean Tasks
  # ===========================================================================

  clean:
    desc: Clean all build artifacts
    cmds:
      - echo "Cleaning all build artifacts..."
      - cargo clean
      - echo "✓ Clean complete"

  clean-wasm:
    desc: Clean WASM build artifacts
    cmds:
      - echo "Cleaning WASM artifacts..."
      - rm -rf target/{{.WASM_TARGET}}
      - echo "✓ WASM clean complete"

  # ===========================================================================
  # Quality Tasks
  # ===========================================================================

  lint:
    desc: Run clippy linter
    cmds:
      - echo "Running clippy..."
      - cargo clippy --workspace -- -D warnings
      - echo ""
      - echo "✓ Clippy passed"

  format:
    desc: Format code with rustfmt
    cmds:
      - echo "Formatting code..."
      - cargo fmt --all
      - echo ""
      - echo "✓ Code formatted"

  # ===========================================================================
  # Inspection Tasks
  # ===========================================================================

  inspect:
    desc: Inspect the composite WASM component (dist/antikythera-sdk.wasm)
    deps:
      - build
    cmds:
      - echo "Inspecting composite WASM component..."
      - wasm-tools component info {{.DIST_SDK}} || echo "wasm-tools not installed"
      - echo ""
      - wasm-tools component wit {{.DIST_SDK}} || echo "wasm-tools not installed"

  size:
    desc: Show WASM artifact sizes
    cmds:
      - |
        echo "Binary Sizes:"
        echo "─────────────────────────────────"
        if [ -f "{{.WASM_BINARY}}" ]; then
          WASM_SIZE=$(stat -f%z "{{.WASM_BINARY}}" 2>/dev/null || stat -c%s "{{.WASM_BINARY}}" 2>/dev/null || echo "?")
          echo "  SDK standalone:   $WASM_SIZE bytes"
        else
          echo "  SDK standalone:   not built"
        fi
        if [ -f "{{.TOOLRUNNER_BINARY}}" ]; then
          TR_SIZE=$(stat -f%z "{{.TOOLRUNNER_BINARY}}" 2>/dev/null || stat -c%s "{{.TOOLRUNNER_BINARY}}" 2>/dev/null || echo "?")
          echo "  toolrunner:       $TR_SIZE bytes"
        else
          echo "  toolrunner:       not built"
        fi
        if [ -f "{{.DIST_SDK}}" ]; then
          COMPOSITE_SIZE=$(stat -f%z "{{.DIST_SDK}}" 2>/dev/null || stat -c%s "{{.DIST_SDK}}" 2>/dev/null || echo "?")
          echo "  composite (dist): $COMPOSITE_SIZE bytes"
        else
          echo "  composite (dist): not built"
        fi
        echo "─────────────────────────────────"
