[package]
name = "logic-core-host-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-llm-agent: standalone logic core running the FULL CUSTOM LOOP through host-imports (call-llm, save-state/load-state, emit-tool-call, log-message) — activation proof that the host-imports import survives component pruning"

[lib]
# rlib:   native Rust builds (compiles the native stubs of the custom_* surface).
# cdylib: required by cargo-component to emit the wasm32-wasip1 component
#         artifact (same dual crate-type as examples/logic-core-example).
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# World exported by this component; `path` is resolved relative to this
# crate's manifest directory. The crate lives at examples/logic-core-host-example,
# two levels below the repo root, so the canonical root `wit/` is `../../wit`
# (same relative path as examples/logic-core-template).
[package.metadata.component.target]
path = "../../wit"
world = "logic-core-component"

[features]
default = []
# Server-side WASM Component Model support (wasm32-wasip1 WASI).
# The host-imports loop (host_call_llm, host_save_state, host_load_state,
# host_emit_tool_call, host_log) and the session-state JSON only compile in
# this mode; the native rlib compiles `None` stubs for the active hooks.
component = ["dep:wit-bindgen", "dep:serde_json"]

[dependencies]
# WIT bindings generator for the component world (component feature only).
# Pin matches examples/logic-core-template and the locked 0.40.0 so the
# emitted `component-type` sections decode cleanly with wasm-tools 1.256.
wit-bindgen = { version = "0.40.0", optional = true }
# JSON handling for the host-imports plumbing and the in-example session
# state (component feature only: the native custom_* stubs are JSON-free).
serde_json = { workspace = true, optional = true }
