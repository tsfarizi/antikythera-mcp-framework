[package]
name = "antikythera-cli"
version = "1.5.1"
edition = "2024"
authors = ["tsfarizi"]
license = "MIT"
repository = "https://github.com/tsfarizi/antikythera-mcp-framework"
readme = "README.md"
description = "CLI interface for Antikythera MCP client"

[workspace]

[features]
default = ["multi-agent", "native-transport"]
multi-agent = ["antikythera-core/multi-agent"]
native-transport = ["antikythera-core/native-transport", "dep:sysinfo"]
wizard = ["antikythera-core/wizard"]

[[bin]]
name = "antikythera"
path = "src/bin/menu.rs"

[[bin]]
name = "antikythera-config"
path = "src/bin/config.rs"

# ============================================================================
# CLI Unit Tests
# ============================================================================

[[test]]
name = "cli_tests"
path = "tests/mod.rs"

# ============================================================================
# Config Tests (moved from framework)
# ============================================================================

[[test]]
name = "comprehensive_config_security_tests"
path = "tests/config/comprehensive_config_security_tests.rs"

[[test]]
name = "parsing_tests"
path = "tests/config/parsing_tests.rs"

# ============================================================================
# Contract Tests (moved from framework)
# ============================================================================

[[test]]
name = "contract_compatibility_tests"
path = "tests/contract/compatibility_tests.rs"

# ============================================================================
# Transport Tests (moved from framework)
# ============================================================================

[[test]]
name = "http_transport_cache_tests"
path = "tests/transport_tests/http_transport_cache.rs"

[[test]]
name = "builtin_transport_tests"
path = "tests/transport_tests/builtin_transport_tests.rs"

# ============================================================================
# Provider Tests (moved from framework)
# ============================================================================

[[test]]
name = "type_detection_tests"
path = "tests/provider/type_detection_tests.rs"

# ============================================================================
# Security Tests (moved from framework)
# ============================================================================

[[test]]
name = "security_rate_limit_tests"
path = "tests/security/rate_limit_tests.rs"

[[test]]
name = "security_rate_limit_concurrent"
path = "tests/security/rate_limit_concurrent.rs"

[[test]]
name = "security_validation_tests"
path = "tests/security/validation_tests.rs"

[[test]]
name = "security_secrets_tests"
path = "tests/security/secrets_tests.rs"

# ============================================================================
# Server Tests (moved from framework)
# ============================================================================

[[test]]
name = "server_validation_tests"
path = "tests/server/validation_tests.rs"

[dependencies]
antikythera-core = { path = "../../antikythera-core", version = "1.5.1", features = ["full"] }
antikythera-sdk = { path = "../../antikythera-sdk", version = "1.5.1", features = ["component"] }
antikythera-log = { path = "../../antikythera-log", version = "1.5.1" }
antikythera-security = { path = "../../antikythera-security", features = ["full"] }
antikythera-session = { path = "../../antikythera-session", version = "1.5.1" }
antikythera-storage = { path = "../../antikythera-storage", version = "1.5.1", features = ["filesystem"] }

# Core async runtime
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util"] }
futures = "0.3.32"
async-trait = "0.1.89"

# HTTP client (for LLM API calls and transport)
reqwest = { version = "0.12.9", features = ["json", "stream"] }
reqwest-eventsource = "0.6.0"
tokio-stream = "0.1.18"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
postcard = { version = "1.1.3", features = ["alloc"] }

# CLI and TUI
clap = { version = "4.6.1", features = ["derive"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

# Error handling and logging
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

# Utilities
uuid = { version = "1.23.1", features = ["v4"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde", "wasmbind"] }
sysinfo = { version = "0.38.4", optional = true }
dotenvy = "0.15.7"
shellexpand = "3.1.2"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.52.1", features = ["test-util"] }
serial_test = "3.0"
antikythera-sdk = { path = "../../antikythera-sdk", version = "1.5.1", features = ["component"] }
