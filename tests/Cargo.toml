# ============================================================================
# Dependencies
# ============================================================================

[dependencies]
antikythera-log = { path = "../antikythera-log", features = ["subscriber"] }
antikythera-session = { path = "../antikythera-session" }
antikythera-core = { path = "../antikythera-core", features = ["full"] }
antikythera-sdk = { path = "../antikythera-sdk", features = ["component", "multi-agent"] }
antikythera-storage = { path = "../antikythera-storage", features = ["filesystem"] }
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
tempfile = "3.10"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "test-util"] }
serial_test = "3.0"
async-trait.workspace = true
clap.workspace = true
ratatui.workspace = true
