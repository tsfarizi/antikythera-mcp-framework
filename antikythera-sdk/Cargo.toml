[package]
name = "antikythera-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "High-level API wrapper with FFI and WASM bindings"

[lib]
# rlib for native + cdylib for cargo-component wasip2 component emission
crate-type = ["rlib", "cdylib"]

[package.metadata.component]
package = "antikythera:agent-sdk"

# Target world for the component; `path` is resolved relative to this
# crate's manifest directory, pointing at the canonical root `wit/`.
[package.metadata.component.target]
path = "../wit"
world = "antikythera-agent-sdk"

[package.metadata.component.dependencies]

[features]
default = []

# Server-side WASM Component Model support (wasm32-wasip2 WASI).
component = ["dep:wit-bindgen"]

# In-process tool execution via antikythera-toolrunner
toolrunner = ["dep:antikythera-toolrunner"]

# Wasmtime-based sandbox execution
wasm-sandbox = ["dep:wasmtime", "dep:anyhow"]

[dependencies]
# Core - always available
antikythera-core = { path = "../antikythera-core", version = "1.0.0" }

# Logging
antikythera-log = { path = "../antikythera-log", version = "1.0.0", features = ["subscriber"] }

# Session management
antikythera-session = { path = "../antikythera-session", version = "1.0.0" }

# Proc-macro derives (FsmComplete transition matrix generation)
antikythera-macros = { path = "../antikythera-macros" }

# In-process tool execution (optional)
antikythera-toolrunner = { path = "../plugin/antikythera-toolrunner", version = "1.5.1", optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# WASM runtime (optional, for sandboxed execution)
wasmtime = { version = "36.0", optional = true }
anyhow = { version = "1.0", optional = true }

# WIT bindings generator for the component world (component feature only).
# The pinned wit-bindgen version matches the toolchain's wit-parser so the emitted `component-type` sections decode cleanly.
wit-bindgen = { version = "0.40.0", optional = true }



[dev-dependencies]
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "test-util"] }
serial_test = "3.0"
